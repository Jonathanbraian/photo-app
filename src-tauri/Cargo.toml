[package]
name = "photo-batch-editor"
version = "0.1.0"
description = "Photo Batch Editor — edição de cor e luz em lote"
authors = ["Nexsyss"]
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "photo_batch_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
