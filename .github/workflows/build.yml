name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint e testes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - name: Typecheck e build da interface
        run: npm run build
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal — Apple Silicon + Intel)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            artifact: photo-batch-editor-macos
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            rust-targets: ""
            args: --bundles msi
            artifact: photo-batch-editor-windows
            path: src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}

      - run: npm ci

      - name: Testes do motor (${{ matrix.name }})
        # `generate_context!` precisa da interface compilada em dist/.
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build do instalador
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
